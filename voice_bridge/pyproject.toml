[project]
name = "smartring-voice-bridge"
version = "0.3.3"
description = "Durable LAN voice receiver and local transcription for Smartring"
requires-python = ">=3.11,<3.14"
dependencies = ["Pillow>=11,<13", "fonttools>=4,<5", "websockets>=17,<18"]

[project.optional-dependencies]
transcription = [
    "av>=11,<19",
    "faster-whisper>=1.2.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "grok-gadgets-gateway==0.1.0a14"]

[project.scripts]
voice-bridge = "voice_bridge.cli:main"
voice-device-relay = "voice_bridge.device_relay:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
