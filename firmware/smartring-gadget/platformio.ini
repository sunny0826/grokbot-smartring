; SmartRing-Plus (ESP32-S3-N16R8) minimal Grok Gadgets firmware.
; Pins the GrokGadgets library from the cloned SDK; mirrors the SDK's esp32s3
; base config (16 MB quad flash, 8 MB octal PSRAM, native USB CDC).
[platformio]
default_envs = smartring-plus-usb

[env:smartring-plus-usb]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.0
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@1.40501.0
    platformio/tool-scons@4.40801.0
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
build_unflags = -std=gnu++11
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++14
lib_extra_dirs = ../../reference/grok-gadgets-esp32-sdk/lib
lib_deps =
    bblanchon/ArduinoJson@6.21.5
upload_speed = 460800
monitor_speed = 115200
